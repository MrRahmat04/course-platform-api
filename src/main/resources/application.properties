spring.application.name=courseplatform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/courses}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app_dev_only}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# JWT configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
